<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#080A0F"
  >

  <meta
    name="description"
    content="KTMS Player Web App"
  >

  <link
    rel="manifest"
    href="/manifest.webmanifest"
  >

  <link
    rel="stylesheet"
    href="/css/app.css"
  >

  <link
    rel="stylesheet"
    href="/css/components.css"
  >

  <title>KTMS</title>
</head>

<body>

  <div
    id="app"
    class="app"
  >

    <header
      id="app-header"
      class="app-header"
    >

      <a
        href="/"
        class="brand"
        data-route
        aria-label="KTMS Home"
      >
        <span class="brand-mark">KT</span>
        <span class="brand-name">KTMS</span>
      </a>

      <nav
        id="desktop-navigation"
        class="desktop-navigation"
        aria-label="Primary navigation"
      >

        <a href="/" data-route>Home</a>

        <a
          href="/tournaments"
          data-route
        >
          Tournaments
        </a>

        <a
          href="/dashboard"
          data-route
        >
          My Tournaments
        </a>

        <a
          href="/dashboard/fixtures"
          data-route
        >
          Fixtures
        </a>

        <a
          href="/dashboard/results"
          data-route
        >
          Results
        </a>

        <a
          href="/dashboard/notifications"
          data-route
        >
          Notifications
        </a>

      </nav>

      <div class="header-actions">

        <a
          href="/login"
          id="header-login"
          class="button button-primary button-small"
          data-route
        >
          Login
        </a>

        <button
          id="menu-toggle"
          class="icon-button"
          type="button"
          aria-label="Open menu"
          aria-expanded="false"
          aria-controls="secondary-menu"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>

      </div>

    </header>


    <aside
      id="secondary-menu"
      class="secondary-menu"
      aria-hidden="true"
    >

      <div class="secondary-menu-header">

        <strong>KTMS</strong>

        <button
          id="menu-close"
          class="icon-button"
          type="button"
          aria-label="Close menu"
        >
          ×
        </button>

      </div>

      <nav aria-label="Secondary navigation">

        <a
          href="/dashboard/profile"
          data-route
        >
          Profile
        </a>

        <a
          href="/dashboard/account"
          data-route
        >
          Account
        </a>

        <a
          href="/dashboard/support"
          data-route
        >
          Support
        </a>

        <button
          id="menu-logout"
          type="button"
          class="menu-button"
        >
          Logout
        </button>

      </nav>

    </aside>


    <main
      id="main-content"
      class="main-content"
      tabindex="-1"
    >
      <!-- Router renders pages here -->
    </main>


    <nav
      id="mobile-navigation"
      class="mobile-navigation"
      aria-label="Mobile primary navigation"
    >

      <a
        href="/"
        data-route
      >
        <span class="nav-icon">⌂</span>
        <span>Home</span>
      </a>

      <a
        href="/tournaments"
        data-route
      >
        <span class="nav-icon">◫</span>
        <span>Tournaments</span>
      </a>

      <a
        href="/dashboard"
        data-route
      >
        <span class="nav-icon">◎</span>
        <span>My KT</span>
      </a>

      <a
        href="/dashboard/fixtures"
        data-route
      >
        <span class="nav-icon">◈</span>
        <span>Fixtures</span>
      </a>

      <a
        href="/dashboard/profile"
        data-route
      >
        <span class="nav-icon">○</span>
        <span>Profile</span>
      </a>

    </nav>


    <div
      id="toast-container"
      class="toast-container"
      aria-live="polite"
      aria-atomic="true"
    ></div>


    <div
      id="modal-root"
      class="modal-root"
    ></div>

  </div>


  <script
    type="module"
    src="/js/app.js"
  ></script>

</body>
</html>
